# CNB Island 流水线
# 节点：amd64（上限 64 核）；环境：.ide/Dockerfile 动态构建（基础镜像 rust，含 Node.js + bun），
# 镜像版本哈希不变时直接复用制品库缓存
# 说明：macOS .app/.dmg 产物无法在 Linux 云端构建，接入自托管 Mac Runner 后再扩展打包阶段

.ci-runner: &ci-runner
  tags: cnb:arch:amd64
  cpus: 64

.ci-docker: &ci-docker
  build: .ide/Dockerfile
  volumes:
    - /root/.bun:copy-on-write              # bun 依赖缓存
    - /usr/local/cargo:copy-on-write        # cargo registry 缓存

.github-sync: &github-sync
  name: sync-to-github
  # 用脚本阶段直接 git push，而不是插件任务：
  # 插件任务读不到 imports 导入的自定义环境变量（CNB 文档「环境变量传递规则」），
  # 凭据因此会是空值；脚本阶段里 imports 的变量可见。
  imports:
    - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
  stages:
    - name: 推送到 GitHub
      script: |
        set -eu
        test -n "${GIT_USERNAME:-}" -a -n "${GIT_ACCESS_TOKEN:-}" \
          || { echo "缺少 GIT_USERNAME / GIT_ACCESS_TOKEN，检查 arsrna/env 的 git.yaml"; exit 1; }
        git config --global user.name "$GIT_USERNAME"
        git config --global user.email "${GIT_EMAIL:-$GIT_USERNAME@users.noreply.github.com}"
        for k in $(git config --global --name-only --get-regexp '^credential\.'); do
          git config --global --unset-all "$k"
        done
        # 只把 GitHub 凭据交给 GitHub，不写进仓库的 .git/config，也不改变 CNB 远端
        git config --global credential."https://github.com".username "$GIT_USERNAME"
        git config --global credential."https://github.com".helper \
          "!f() { echo username=$GIT_USERNAME; echo password=$GIT_ACCESS_TOKEN; }; f"
        git remote add github https://github.com/ArSrNa/cnb-widget.git || \
          git remote set-url github https://github.com/ArSrNa/cnb-widget.git
        git push github "HEAD:refs/heads/${CNB_BRANCH}" --force
        # 没有标签时 git push --tags 会空跑退出，不算失败
        git push github --tags --force || test -z "$(git tag)"
        echo "已同步 ${CNB_BRANCH} ($(git rev-parse --short HEAD)) 到 GitHub"

.ci-stages: &ci-stages
  - name: 前端依赖安装
    script: bun install --frozen-lockfile
  - name: 前端构建
    script: bun run build
  - name: Rust 格式检查
    script: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
  - name: Rust 静态检查
    script: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
  - name: Rust 单元测试
    script: cargo test --manifest-path src-tauri/Cargo.toml --workspace

main:
  push:
    - name: build-and-check
      runner: *ci-runner
      docker: *ci-docker
      stages: *ci-stages
    - *github-sync
  pull_request:
    - name: build-and-check
      runner: *ci-runner
      docker: *ci-docker
      stages: *ci-stages
  tag_push:
    - *github-sync

demo: # demo 分支与 main 保持镜像同步
  push:
    - name: build-and-check
      runner: *ci-runner
      docker: *ci-docker
      stages: *ci-stages
    - *github-sync

v*: # 打 tag（如 v0.1.0）触发发布构建
  tag_push:
    - name: release-build
      runner: *ci-runner
      docker: *ci-docker
      stages:
        - name: 前端依赖安装
          script: bun install --frozen-lockfile
        - name: 前端构建
          script: bun run build
        - name: Rust 检查与测试
          script: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path src-tauri/Cargo.toml --workspace
        - name: Release 构建
          script: bun run tauri build

# GitHub 镜像同步：用 tencentcom/git-sync 推送代码与标签
# 密钥来自密钥仓库 arsrna/env 的 git.yaml（GIT_USERNAME / GIT_ACCESS_TOKEN / GIT_EMAIL），
# 该文件需声明 allow_slugs: arsrna/cnb-widget 才允许本仓库流水线引用
github-sync: # 手动触发：push 一次分支或修改一次该分支即可全量同步（含标签）
  web_trigger:
    - <<: *github-sync
      branches: main
    - <<: *github-sync
      branches: demo

$: # 云原生开发环境（WebIDE / VSCode 客户端）
  vscode:
    - docker:
        build: .ide/Dockerfile
        image: docker.cnb.cool/arsrna/dev-image/rust # 构建失败时的回退镜像
      services:
        - vscode
        - docker
      stages:
        - name: 环境自检
          script: node -v && bun -v && rustc --version && cargo --version
